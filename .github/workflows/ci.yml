name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    # Inventor can't run on a CI runner. This job checks everything that does not
    # need it: the server imports both ways clients launch it, every tool is
    # described, and the README tool count is current. Geometry is covered by
    # tests/smoke_test.py, which contributors run against a real Inventor.
    name: server checks (mcp ${{ matrix.mcp }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["<2", ">=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "mcp[cli]${{ matrix.mcp }}" pywin32
      - name: Workflow files are valid YAML
        # GitHub silently refuses an invalid workflow (it only shows a red run on push),
        # which for publish.yml would surface only at release time.
        run: |
          python -m pip install pyyaml
          python -c "import glob, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('.github/workflows/*.yml')]; print('workflows OK')"
      - name: Byte-compile
        run: python -m compileall -q inventor_mcp_server src tests
      - name: Server checks
        run: python -X utf8 tests/check_server.py
      - name: Wheel contains only the package
        # Guards against publishing a top-level `src` (or tests/skills) module to PyPI.
        run: |
          python -m pip wheel . --no-deps -q -w dist
          python -c "import glob, zipfile; tops = {n.split('/')[0] for n in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()}; extra = {t for t in tops if t != 'inventor_mcp_server' and not t.endswith('.dist-info')}; print('wheel top-level:', sorted(tops)); raise SystemExit(f'unexpected: {extra}' if extra else 0)"
