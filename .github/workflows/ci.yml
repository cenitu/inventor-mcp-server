name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    # Inventor can't run on a CI runner. This job checks everything that does not
    # need it: the server imports both ways clients launch it, every tool is
    # described, and the README tool count is current. Geometry is covered by
    # tests/smoke_test.py, which contributors run against a real Inventor.
    name: server checks (mcp ${{ matrix.mcp }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["<2", ">=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "mcp[cli]${{ matrix.mcp }}" pywin32
      - name: Byte-compile
        run: python -m compileall -q src tests
      - name: Server checks
        run: python -X utf8 tests/check_server.py
